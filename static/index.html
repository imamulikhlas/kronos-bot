<!doctype html>
<html lang="id" data-market="crypto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kronos</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231B1C19'/%3E%3Ccircle cx='15' cy='17' r='6.5' fill='none' stroke='%23ECEDE8' stroke-width='3'/%3E%3Ccircle cx='22.5' cy='9.5' r='3' fill='%23FF4FA3'/%3E%3C/svg%3E">
  <script>
    try {
      const t = localStorage.getItem("kronos-theme"); if (t) document.documentElement.dataset.theme = t;
      const m = localStorage.getItem("kronos-market"); if (m) document.documentElement.dataset.market = m;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <a class="mark" href="#/" aria-label="Kronos, halaman utama">
        <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="15" cy="17" r="8" fill="none" stroke="currentColor" stroke-width="3.2"/><circle cx="23.5" cy="8.5" r="3.6" class="dot"/></svg>
        <span>kronos</span>
      </a>
      <div class="market-switch" id="marketSwitch" role="tablist" aria-label="Pilih market">
        <a href="#/crypto/overview" data-m="crypto" role="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.5 8h4a2 2 0 0 1 0 4h-4m0 0h4.5a2 2 0 0 1 0 4H9.5V8M11 6.5V8m0 8v1.5"/></svg>Crypto<i class="pulse-dot" data-dot="crypto"></i></a>
        <a href="#/forex/overview" data-m="forex" role="tab"><svg viewBox="0 0 24 24"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>Forex<i class="pulse-dot" data-dot="forex"></i></a>
      </div>
      <div class="top-right">
        <a class="btn ghost sm acct" href="#/account" data-nav="account"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="3.5"/><path d="M5 19.5c1.2-3.2 3.8-4.8 7-4.8s5.8 1.6 7 4.8"/></svg><span>Account</span></a>
        <button class="icon-btn" id="themeBtn" type="button" aria-label="Ganti tema terang/gelap"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
      </div>
    </div>
    <div class="sub-row" id="subRow">
      <nav class="subnav" aria-label="Menu market">
        <a data-nav="overview"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg><span>Overview</span></a>
        <a data-nav="markets"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg><span>Markets</span></a>
        <a data-nav="chart"><svg viewBox="0 0 24 24"><path d="M4 18.5 9 13l3.5 3L20 7.5"/><path d="M15 7.5h5v5"/></svg><span>Chart</span></a>
        <a data-nav="backtest"><svg viewBox="0 0 24 24"><path d="M12 7.5V12l3 2"/><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6M3 4v4h4"/></svg><span>Backtest</span></a>
        <a data-nav="settings"><svg viewBox="0 0 24 24"><path d="M4 8h9M17 8h3M4 16h3M11 16h9"/><circle cx="15" cy="8" r="2"/><circle cx="9" cy="16" r="2"/></svg><span>Settings</span></a>
      </nav>
      <a class="bot-pill" id="botPill" href="#/"></a>
    </div>
  </header>
  <main id="view" tabindex="-1"></main>
  <div id="toasts" aria-live="polite"></div>
  <div id="modal" class="modal" hidden></div>
  <script src="/static/vendor/lightweight-charts.standalone.production.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
